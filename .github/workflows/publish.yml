name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore ZLogger.Scintilla/ZLogger.Scintilla.csproj

      - run: dotnet build ZLogger.Scintilla/ZLogger.Scintilla.csproj -c Release --no-restore

      - run: dotnet pack ZLogger.Scintilla/ZLogger.Scintilla.csproj -c Release --no-build -o nupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: trgiangv

      - name: Push to NuGet
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path nupkg -Filter *.nupkg | Select-Object -First 1
          dotnet nuget push $pkg.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
